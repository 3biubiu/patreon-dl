<!doctype html>
<html>
<head><meta charset="utf-8"><title>ffmpeg.wasm check</title></head>
<body style="font-family: system-ui; padding: 1rem">
<h1>ffmpeg.wasm extraction check</h1>
<pre id="out" style="white-space: pre-wrap">starting...</pre>
<script type="module">
// Exercises exactly what the upload page does: the module worker, the core
// served from /assets/ffmpeg, a WORKERFS mount, and the libopus encode.
import { FFmpeg } from '/node_modules/@ffmpeg/ffmpeg/dist/esm/index.js';

const out = document.getElementById('out');
const lines = [];
const say = (text) => {
  lines.push(text);
  out.textContent = lines.join('\n');
};
// Posted back so the result is readable from the terminal that started the
// server, rather than having to be copied out of the page by hand.
const report = () => {
  try {
    navigator.sendBeacon('/result', lines.join('\n'));
  }
  catch (e) { /* the page still shows it */ }
};

const CORE_BASE = '/assets/ffmpeg';
const AUDIO_ARGS = [
  '-vn', '-ac', '1', '-ar', '16000',
  '-c:a', 'libopus', '-b:a', '24k', '-application', 'voip'
];

try {
  const ffmpeg = new FFmpeg();
  const logs = [];
  ffmpeg.on('log', ({ message }) => logs.push(message));

  say('loading core...');
  await ffmpeg.load({
    coreURL: `${CORE_BASE}/ffmpeg-core.js`,
    wasmURL: `${CORE_BASE}/ffmpeg-core.wasm`
  });
  say('LOAD OK');

  const response = await fetch('/sample.mp4');
  const blob = await response.blob();
  const file = new File([ blob ], 'input.bin', { type: 'video/mp4' });
  say(`input ${file.size} bytes`);

  await ffmpeg.createDir('/mount');
  const mounted = await ffmpeg.mount('WORKERFS', { files: [ file ] }, '/mount');
  say(`MOUNT ${mounted ? 'OK' : 'FAILED'}`);
  if (!mounted) { throw Error('WORKERFS unavailable'); }

  const code = await ffmpeg.exec([ '-i', '/mount/input.bin', ...AUDIO_ARGS, 'audio.ogg' ]);
  say(`EXEC exit ${code}`);
  const data = await ffmpeg.readFile('audio.ogg');
  say(`OUTPUT ${data.length} bytes`);
  // The Ogg magic, so this is a real container and not an empty file.
  const magic = String.fromCharCode(...data.slice(0, 4));
  say(`MAGIC ${magic}`);
  say(logs.filter((l) => /Opus|Stream #|Output #/.test(l)).slice(0, 6).join('\n'));
  say(code === 0 && data.length > 0 && magic === 'OggS' ? 'RESULT PASS' : 'RESULT FAIL');
  report();
}
catch (error) {
  say(`RESULT FAIL: ${error instanceof Error ? error.message : String(error)}`);
  report();
}
</script>
</body>
</html>
